interface:
  display_name: PostNitro
  short_description: Create on-brand carousels, image posts, and short videos, then schedule them to LinkedIn, Instagram, TikTok, and Threads.
  icon_small: ./assets/square-logo.svg
  icon_large: ./assets/square-logo.png
  brand_color: "#087A68"
  default_prompt: Create a social post with PostNitro and schedule it.

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: mcp
      value: postnitro
      description: PostNitro MCP server — carousel, image, and video generation plus scheduling.
      transport: streamable_http
      url: https://mcp.postnitro.ai/mcp
